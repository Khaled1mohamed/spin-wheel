<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>English Zone Lucky Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
<style>
/* Layout: one centred wheel (ring, rotating face, hub, pointer), spin button and recent spins underneath, result sheet over everything. */
:root{
  --bg:#edf3fd; --bg-glow:#cfe1ff; --surface:#ffffff; --surface-2:#f1f6ff; --ink:#0f2447; --muted:#53668a; --line:#cddbf2;
  --accent:#2a73da; --accent-hover:#1f63c4; --accent-text:#1d5cbd;
  --navy:#163f7a; --gold:#ffc83d; --good:#12915a; --warn:#c96a00;
  --w-white:#ffffff; --w-sky:#dcebff; --w-blue:#2a73da; --w-navy:#163f7a; --w-line:rgba(22,63,122,.42);
  --shadow:0 34px 60px -24px rgba(22,63,122,.55),0 12px 26px -12px rgba(22,63,122,.4);
  --font-display:'Outfit',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071630; --bg-glow:#10306a; --surface:#0f2650; --surface-2:#143064; --ink:#eaf1ff; --muted:#a0b4da; --line:#264a82;
    --accent-text:#93bdff; --shadow:0 34px 70px -24px rgba(0,0,0,.8),0 12px 26px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071630; --bg-glow:#10306a; --surface:#0f2650; --surface-2:#143064; --ink:#eaf1ff; --muted:#a0b4da; --line:#264a82;
  --accent-text:#93bdff; --shadow:0 34px 70px -24px rgba(0,0,0,.8),0 12px 26px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--ink);
  background:radial-gradient(80% 50% at 50% 0%,var(--bg-glow),transparent 72%) no-repeat,var(--bg);
  padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{width:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:flex;align-items:center;background:var(--navy);border-radius:12px;padding:8px 12px}
.brand-mark img{display:block;height:22px;width:auto}
h1{margin:0;font:800 clamp(18px,3.4vw,24px)/1.1 var(--font-display);letter-spacing:.01em}
.tools{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:22px;height:22px}

.main{--size:max(280px,min(calc(100vw - 32px),720px,calc(100vh - 280px)));width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}
.stage-wrap{padding-top:calc(var(--size)*.045)}
.stage{position:relative;width:var(--size);height:var(--size)}
.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.shadow{position:absolute;inset:.6%;border-radius:50%;background:var(--w-blue);box-shadow:var(--shadow)}
.clip{position:absolute;inset:0;overflow:hidden}
.rotor{position:absolute;inset:0;will-change:transform;transform:rotate(0deg)}
.hubsvg{pointer-events:none}
.hub{pointer-events:auto;cursor:pointer}
.hub-press{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.hub:active .hub-press{transform:scale(.97)}
.hub-shadow{filter:drop-shadow(0 6px 10px rgba(5,18,45,.5))}
.hub-line{font:800 56px var(--font-display);letter-spacing:.01em;fill:#fff;user-select:none}
.pulse{fill:none;stroke:var(--w-blue);stroke-width:7;opacity:0;transform-box:fill-box;transform-origin:center}
.stage.idle .pulse{animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.2);opacity:0}}
.lbl{font:800 28px var(--font-display);letter-spacing:.02em;user-select:none}
.num{font:800 24px var(--font-display);user-select:none}
.glow{opacity:0;pointer-events:none}
.glow.hit{animation:flash 1.1s ease-in-out 1}
@keyframes flash{0%,100%{opacity:0}30%{opacity:.6}55%{opacity:.12}75%{opacity:.5}}
.bulb.extra{opacity:0}
.stage.busy .bulb.a{animation:chase .5s steps(1,end) infinite}
.stage.busy .bulb.b{animation:chase .5s steps(1,end) infinite;animation-delay:-.25s}
@keyframes chase{0%{opacity:1}50%{opacity:.18}100%{opacity:1}}
.ptr-svg{position:absolute;left:44%;top:-5%;width:12%;height:16%;overflow:visible;pointer-events:none;z-index:4}
.ptr{filter:drop-shadow(0 5px 5px rgba(5,18,45,.45))}

.controls{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.spin-btn{display:inline-flex;align-items:center;gap:12px;min-height:60px;padding:16px 40px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:800 20px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;box-shadow:0 16px 28px -12px rgba(42,115,218,.85),inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .15s,filter .15s,opacity .2s}
.spin-btn:hover{filter:brightness(1.08)}
.spin-btn:active{transform:translateY(2px)}
.spin-btn[aria-disabled="true"]{opacity:.6;cursor:progress;filter:none;transform:none}
.spin-btn svg{width:24px;height:24px}
.hint{margin:0;color:var(--muted);font-size:15px;max-width:34ch;text-wrap:balance}

.history{width:100%;max-width:720px}
.label{margin:0 0 10px;font:700 12px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.chip .badge{width:24px;height:24px;font-size:12px}
.empty{margin:0;color:var(--muted);font-size:15px}
.badge{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--w-blue);color:#fff;font:800 14px/1 var(--font-display);letter-spacing:0}
.badge.inv{background:#fff;color:var(--w-blue)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.scrim{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(5,16,38,.68);animation:fade .25s ease-out}
.sheet{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:28px;box-shadow:0 40px 90px -20px rgba(0,0,0,.6);animation:rise .45s cubic-bezier(.2,.9,.25,1.08)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(32px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:relative;display:flex;align-items:center;gap:16px;padding:24px 68px 22px 22px;background:var(--navy);color:#fff}
.sheet-head.prize{background:linear-gradient(135deg,var(--w-blue),var(--navy) 70%)}
.head-icon{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .55s .15s cubic-bezier(.3,1.5,.5,1) both}
.head-text{min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;font:700 12px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.prize .eyebrow{color:var(--gold)}
.result-title{margin:8px 0 0;font:800 clamp(30px,7vw,42px)/1.02 var(--font-display);text-wrap:balance;overflow-wrap:anywhere}
.close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.close:hover{background:rgba(255,255,255,.28)}
.close svg{width:20px;height:20px}
.close:focus-visible,.sheet-head :focus-visible{outline-color:#fff}
.sheet-body{display:flex;flex-direction:column;gap:22px;padding:22px 24px 24px}
.prompts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prompts li{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.4;font-weight:500}
.prompts li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:.55em}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.starter{padding:7px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--accent-text)}
.prize-text{margin:0;font-size:18px;line-height:1.45;font-weight:500;text-wrap:pretty}
.timer{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line)}
.ring{position:relative;flex:none;width:100px;height:100px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--line);stroke-width:9}
.ring-bar{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .3s}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font:800 32px/1 var(--font-display);font-variant-numeric:tabular-nums}
.timer-side{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 180px}
.timer-title{margin:0;font-weight:700;font-size:17px}
.timer-sub{margin:0;color:var(--muted);font-size:14px;line-height:1.35}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:12px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}

@media (max-width:560px){
  .scrim{align-items:flex-end;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .sheet{width:100%;border-radius:28px 28px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-head{padding:22px 64px 20px 18px;gap:14px}
  .head-icon{width:60px;height:60px}
  .head-icon svg{width:38px;height:38px}
  .sheet-body{padding:20px 18px 22px}
  .spin-btn{padding:16px 32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .stage.idle .pulse{animation:none}
}
</style>

<div id="root"></div>
